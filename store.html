<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجر Gnanoo Tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0f13; --bg-soft:#171a20; --accent:#C98A3E; --line:#2A2E36;
    --text:#F2EEE3; --muted:#9a9587;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Cairo', sans-serif; padding-bottom:40px;
  }
  header{
    text-align:center; padding:28px 16px 20px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, #171a20, #0d0f13);
  }
  header .logo{ font-size:1.5rem; font-weight:800; color:var(--accent); margin-bottom:4px; }
  header .sub{ color:var(--muted); font-size:.9rem; }

  .search-wrap{ max-width:600px; margin:18px auto 0; padding:0 16px; }
  .search-wrap input{
    width:100%; padding:12px 16px; border-radius:14px; border:1.5px solid var(--line);
    background:var(--bg-soft); color:var(--text); font-family:'Cairo',sans-serif; font-size:.9rem; outline:none;
  }
  .search-wrap input:focus{ border-color:var(--accent); }

  .grid{
    max-width:1100px; margin:24px auto; padding:0 16px;
    display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:18px;
  }
  .card{
    background:var(--bg-soft); border:1.5px solid var(--line); border-radius:18px; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .card .main-img{
    width:100%; aspect-ratio:4/3; object-fit:cover; background:#0d0f13; display:block;
  }
  .card .no-img{
    width:100%; aspect-ratio:4/3; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:.85rem; background:#0d0f13;
  }
  .sub-imgs{ display:flex; gap:6px; padding:8px 10px 0; overflow-x:auto; }
  .sub-imgs img{
    width:46px; height:46px; border-radius:9px; object-fit:cover; flex-shrink:0;
    border:1px solid var(--line); cursor:pointer;
  }
  .card-body{ padding:12px 14px 14px; flex:1; display:flex; flex-direction:column; }
  .card-title{ font-weight:800; font-size:1.02rem; margin-bottom:8px; color:var(--text); }
  .specs{ display:flex; flex-direction:column; gap:5px; margin-bottom:10px; flex:1; }
  .spec-row{ display:flex; justify-content:space-between; font-size:.82rem; gap:8px; }
  .spec-row .k{ color:var(--muted); flex-shrink:0; }
  .spec-row .v{ color:var(--text); text-align:left; }
  .notes{ font-size:.78rem; color:var(--muted); margin-bottom:10px; line-height:1.5; }
  .contact-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:#25D366; color:#fff; text-decoration:none; font-weight:700; font-size:.88rem;
    padding:11px; border-radius:12px; margin-top:auto;
  }
  .contact-btn svg{ width:18px; height:18px; fill:#fff; }

  .empty-state{ text-align:center; color:var(--muted); padding:60px 20px; font-size:.95rem; }

  .lightbox{
    position:fixed; inset:0; background:rgba(0,0,0,.9); display:none;
    align-items:center; justify-content:center; z-index:999; padding:20px;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width:100%; max-height:100%; border-radius:12px; }
</style>
</head>
<body>

  <header>
    <div class="logo">Gnanoo Tech</div>
    <div class="sub">المتجر - تصفح الأجهزة المتاحة دلوقتي</div>
  </header>

  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="ابحث عن جهاز... (الشركة، الموديل)">
  </div>

  <div class="grid" id="productsGrid">
    <div class="empty-state">بيتحمل...</div>
  </div>

  <div class="lightbox" id="lightbox">
    <img id="lightboxImg" src="" alt="">
  </div>

<script>
(function(){
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzr2mCsxBZST8teHnrm0MegmIg36nE8SGSebzccofnFOxKJ1Cprn7QsAdjfM_uSTerjvA/exec';
  const WHATSAPP_NUMBER = '201026034728';

  const productsGrid = document.getElementById('productsGrid');
  const searchInput = document.getElementById('searchInput');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');

  let allProducts = [];

  function esc(str){
    if(str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function renderCard(p){
    const subImgsHtml = (p.subImages && p.subImages.length)
      ? `<div class="sub-imgs">${p.subImages.map(u => `<img src="${esc(u)}" loading="lazy" onclick="window.__openLightbox('${esc(u)}')">`).join('')}</div>`
      : '';
    const mainImgHtml = p.mainImage
      ? `<img class="main-img" src="${esc(p.mainImage)}" loading="lazy" onclick="window.__openLightbox('${esc(p.mainImage)}')" alt="${esc(p.brand)} ${esc(p.model)}">`
      : `<div class="no-img">لا توجد صورة</div>`;

    const title = `${esc(p.brand)} ${esc(p.model)}`.trim();
    const waMsg = encodeURIComponent(`مرحباً، عايز أستفسر عن الجهاز: ${title}`);
    const waLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${waMsg}`;

    const specRows = [
      ['الهارد', p.storage],
      ['الرامات', p.ram],
      ['الشاشة', p.screenSize ? (p.screenSize + (p.touch === 'نعم' ? ' (تاتش)' : '')) : ''],
      ['GPU', p.gpu]
    ].filter(([,v]) => v).map(([k,v]) => `
      <div class="spec-row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>
    `).join('');

    return `
      <div class="card" data-search="${esc((p.brand + ' ' + p.model).toLowerCase())}">
        ${mainImgHtml}
        ${subImgsHtml}
        <div class="card-body">
          <div class="card-title">${title || 'جهاز'}</div>
          <div class="specs">${specRows}</div>
          ${p.notes ? `<div class="notes">${esc(p.notes)}</div>` : ''}
          <a class="contact-btn" href="${waLink}" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.3 5L2 22l5.2-1.3c1.5.8 3.1 1.2 4.8 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2Zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3.1.8.8-3-.2-.3C4.1 14.9 3.7 13.5 3.7 12c0-4.6 3.7-8.3 8.3-8.3s8.3 3.7 8.3 8.3-3.7 8.2-8.3 8.2Zm4.5-6.2c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1-.2.2-.7.8-.8.9-.1.2-.3.2-.6.1-.2-.1-1-.4-1.9-1.2-.7-.6-1.2-1.4-1.3-1.6-.1-.2 0-.4.1-.5.1-.1.2-.3.4-.4.1-.1.2-.2.2-.4.1-.1 0-.3 0-.4-.1-.1-.6-1.4-.8-1.9-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 1.9s.8 2.2.9 2.4c.1.2 1.6 2.5 4 3.5.6.2 1 .4 1.3.5.6.2 1.1.1 1.5-.1.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2-.1-.1-.2-.2-.5-.3Z"/></svg>
            تواصل معنا
          </a>
        </div>
      </div>`;
  }

  function renderGrid(list){
    if(!list.length){
      productsGrid.innerHTML = '<div class="empty-state">لا يوجد أجهزة متاحة دلوقتي، تابعنا قريب 🙏</div>';
      return;
    }
    productsGrid.innerHTML = list.map(renderCard).join('');
  }

  window.__openLightbox = function(url){
    lightboxImg.src = url;
    lightbox.classList.add('open');
  };
  lightbox.addEventListener('click', ()=> lightbox.classList.remove('open'));

  searchInput.addEventListener('input', ()=>{
    const q = searchInput.value.trim().toLowerCase();
    const filtered = q
      ? allProducts.filter(p => (p.brand + ' ' + p.model).toLowerCase().includes(q))
      : allProducts;
    renderGrid(filtered);
  });

  async function loadProducts(){
    try{
      const res = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'getStoreProducts' })
      });
      const result = await res.json();
      if(result.ok){
        allProducts = (result.items || []).filter(p => p.available);
        renderGrid(allProducts);
      } else {
        productsGrid.innerHTML = '<div class="empty-state">حصل خطأ في تحميل المنتجات، جرب تاني.</div>';
      }
    } catch(e){
      productsGrid.innerHTML = '<div class="empty-state">مفيش نت دلوقتي، جرب تاني.</div>';
    }
  }

  loadProducts();
})();
</script>
</body>
</html>
